services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pro-t3-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pro-t3-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
